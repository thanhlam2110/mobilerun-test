agent:
  name: mobilerun
  max_steps: 20
  reasoning: true
  streaming: true
  after_sleep_action: 1.0
  wait_for_stable_ui: 0.5
  use_normalized_coordinates: false

  fast_agent:
    vision: true
    parallel_tools: true

  manager:
    vision: true
    stateless: true

  executor:
    vision: true

  app_cards:
    enabled: true
    mode: local
    app_cards_dir: config/app_cards
    server_url: null
    server_timeout: 2.0
    server_max_retries: 2

llm_profiles:
  manager:
    provider: Ollama
    model: qwen3.5:4b
    temperature: 0.2
    kwargs:
      base_url: http://localhost:11434
      request_timeout: 180.0

  executor:
    provider: Ollama
    model: qwen3.5:4b
    temperature: 0.1
    kwargs:
      base_url: http://localhost:11434
      request_timeout: 180.0

  fast_agent:
    provider: Ollama
    model: qwen3.5:4b
    temperature: 0.2
    kwargs:
      base_url: http://localhost:11434
      request_timeout: 180.0

  app_opener:
    provider: Ollama
    model: qwen3.5:4b
    temperature: 0.0
    kwargs:
      base_url: http://localhost:11434
      request_timeout: 180.0

  structured_output:
    provider: Ollama
    model: qwen3.5:4b
    temperature: 0.0
    kwargs:
      base_url: http://localhost:11434
      request_timeout: 180.0

device:
  serial: null
  platform: android
  use_tcp: false
  auto_setup: true

tools:
  disabled_tools:
    - click_at
    - click_area
    - long_press_at
  stealth: false

telemetry:
  enabled: false

tracing:
  enabled: false
  provider: phoenix
  langfuse_screenshots: false
  langfuse_secret_key: ""
  langfuse_public_key: ""
  langfuse_host: ""
  langfuse_user_id: anonymous
  langfuse_session_id: ""

logging:
  debug: false
  save_trajectory: none
  trajectory_path: trajectories
  rich_text: false
  trajectory_gifs: true

credentials:
  enabled: false
  file_path: config/credentials.yaml
