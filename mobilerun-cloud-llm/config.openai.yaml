agent:
  name: mobilerun
  max_steps: 20
  reasoning: true #false
  streaming: true
  after_sleep_action: 1.0
  wait_for_stable_ui: 0.3
  use_normalized_coordinates: false

  fast_agent:
    vision: true #false
    parallel_tools: true

  manager:
    vision: true #false
    stateless: false

  executor:
    vision: true #false

  app_cards:
    enabled: true
    mode: local
    app_cards_dir: config/app_cards
    server_url: null
    server_timeout: 2.0
    server_max_retries: 2

llm_profiles:
  manager:
    provider: OpenAIResponses
    model: gpt-4o
    temperature: 0.2
    kwargs:
      max_tokens: 4096

  executor:
    provider: OpenAIResponses
    model: gpt-4o
    temperature: 0.1
    kwargs:
      max_tokens: 4096

  fast_agent:
    provider: OpenAIResponses
    model: gpt-4o
    temperature: 0.2
    kwargs:
      max_tokens: 4096

  app_opener:
    provider: OpenAIResponses
    model: gpt-4o-mini
    temperature: 0.0
    kwargs:
      max_tokens: 2048

  structured_output:
    provider: OpenAIResponses
    model: gpt-4o-mini
    temperature: 0.0
    kwargs:
      max_tokens: 2048

device:
  serial: null
  platform: android
  use_tcp: false
  auto_setup: true

tools:
  disabled_tools:
    - click_at
    - click_area
    - long_press_at
  stealth: false

telemetry:
  enabled: false

tracing:
  enabled: false
  provider: phoenix
  langfuse_screenshots: false
  langfuse_secret_key: ""
  langfuse_public_key: ""
  langfuse_host: ""
  langfuse_user_id: anonymous
  langfuse_session_id: ""

logging:
  debug: false
  save_trajectory: none
  trajectory_path: trajectories
  rich_text: false
  trajectory_gifs: true

credentials:
  enabled: false
  file_path: config/credentials.yaml
